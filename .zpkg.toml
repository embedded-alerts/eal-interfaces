[package]
org = "embedded-alerts"
name = "eal-interfaces"
version = "0.1.0"
description = "Shared interfaces and schemas for Embedded Alerts"
license = "MIT"
language = "universal"

[package.repository]
vcs = "git"
url = "https://github.com/embedded-alerts/eal-interfaces"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "zed_modules/**", "target/**", "dist/**", "*.log"]

[install]
dir = "zed_modules"
adapter = "none"
