name: embedding-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: embedding-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify cross-artifact invariants
        run: node scripts/verify-embedding-contract.mjs
      - name: Compile Microsoft TypeSpec
        run: >-
          npx --yes --package @typespec/compiler@1.15.0
          tsp compile embedding-contract/embeddings.tsp --no-emit
