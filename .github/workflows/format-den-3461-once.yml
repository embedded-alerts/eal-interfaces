name: Format DEN-3461 once

on:
  push:
    branches:
      - agent/den-3461-domain-policy-reconcile

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Apply rustfmt-only chain layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/semantic.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  """        let host = raw_host
                      .trim()
                      .trim_end_matches('.')
                      .to_ascii_lowercase();""",
                  """        let host = raw_host.trim().trim_end_matches('.').to_ascii_lowercase();""",
              ),
              (
                  """            let allowed = allowed
                          .trim()
                          .trim_end_matches('.')
                          .to_ascii_lowercase();""",
                  """            let allowed = allowed.trim().trim_end_matches('.').to_ascii_lowercase();""",
              ),
              (
                  """    let host = raw_host
                  .trim()
                  .trim_end_matches('.')
                  .to_ascii_lowercase();""",
                  """    let host = raw_host.trim().trim_end_matches('.').to_ascii_lowercase();""",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one exact rustfmt target, found {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit formatted source and remove one-shot workflow
        run: |
          git rm .github/workflows/format-den-3461-once.yml
          git add src/semantic.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style(DEN-3461): apply rustfmt layout"
          git push origin HEAD:${GITHUB_REF_NAME}
