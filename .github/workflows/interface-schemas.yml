name: interface-schemas

# Every JSON Schema published by this repo is checked for well-formedness, for
# resolvable $refs, and against its own examples. See schema/README-contract.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interface-schemas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schemas:
    name: JSON Schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test the Rust structural validator
        run: cargo test --bin validate-schemas
      - name: Validate with the Rust structural checks
        run: cargo run --quiet --bin validate-schemas -- --format github
      - name: Validate against the JSON Schema meta-schema
        run: |
          python3 -m pip install --quiet jsonschema
          python3 scripts/validate_schemas.py
