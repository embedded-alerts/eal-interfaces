[package]
name = "eal-interfaces"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Canonical Rust, JSON Schema, OpenAPI, AsyncAPI, and PostgreSQL contracts for Embedded Alerts."
repository = "https://github.com/embedded-alerts/eal-interfaces"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
